[build]
  publish = "."
  functions = "netlify/functions"

# ── Security headers for all pages ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://stream.mux.com blob:; connect-src 'self' https://api.kit.com https://www.google-analytics.com https://stream.mux.com https://*.mux.com; frame-ancestors 'none';"

# ── No-store cache for admin pages ──────────────────────────────────────────
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow"

# ── API redirects to Netlify Functions ──────────────────────────────────────
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/subscribers"
  to = "/.netlify/functions/subscribers"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
