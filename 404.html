<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — Dr. Saby Roy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0C0C0A; --cream: #F7F4EF; --gold: #C9A84C; --forest: #1B4332;
      --display: 'Cormorant Garamond', Georgia, serif;
      --body: 'Inter', system-ui, sans-serif;
    }
    html, body { height: 100%; background: var(--ink); color: var(--cream); font-family: var(--body); }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .eyebrow { font-size: 0.62rem; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; margin-bottom: 1.5rem; }
    h1 { font-family: var(--display); font-size: clamp(5rem, 15vw, 10rem); font-weight: 300; line-height: 1; letter-spacing: -0.04em; color: var(--cream); margin-bottom: 1rem; opacity: 0.15; }
    .msg { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 300; font-style: italic; color: var(--cream); margin-bottom: 1rem; }
    p { font-size: 0.9rem; color: rgba(247,244,239,0.45); line-height: 1.8; margin-bottom: 2.5rem; max-width: 420px; }
    a { display: inline-block; background: var(--gold); color: var(--ink); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; padding: 0.8rem 2rem; text-decoration: none; border-radius: 100px; transition: opacity 0.2s; }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <p class="eyebrow">Error 404</p>
  <h1>404</h1>
  <p class="msg">This page doesn't exist.</p>
  <p>The page you're looking for may have moved, or the link might be wrong. Let's get you back on track.</p>
  <a href="/">← Back to sabyroy.com</a>
</body>
</html>
